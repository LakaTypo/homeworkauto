<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Homework Auto · Log in</title>
<script src="config.js"></script>
<style>
:root{--bg:#0b0d0f;--panel:#141719;--line:#2a3033;--text:#f2f4f4;--muted:#8c969b;--accent:#f2a72c;--red:#f17878;--green:#52d39a}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font:14px/1.5 Inter,ui-sans-serif,system-ui,sans-serif;display:grid;place-items:center;padding:24px}
a{color:var(--accent)}.card{width:min(420px,100%);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px}
.brand{display:flex;align-items:center;gap:10px;font-weight:750;margin-bottom:18px}.mark{width:30px;height:30px;border-radius:9px;background:var(--accent);color:#151515;display:grid;place-items:center;font-weight:900}
h1{font-size:22px;margin:0 0 6px;letter-spacing:-.5px}.sub{color:var(--muted);font-size:13px;margin:0 0 20px}
label{display:block;color:#aab2b5;font-size:12px;margin-bottom:6px}
input{width:100%;background:#0e1112;border:1px solid #303739;color:var(--text);border-radius:8px;padding:11px 12px;margin-bottom:14px;outline:none}
input:focus{border-color:var(--accent)}.btn{width:100%;border:0;border-radius:9px;padding:12px;font-weight:700;background:var(--accent);color:#17130b;cursor:pointer}
.btn:disabled{opacity:.5;cursor:not-allowed}.links{display:flex;justify-content:space-between;margin-top:14px;font-size:12px}
.err{display:none;background:#2b1718;border:1px solid #633032;color:var(--red);border-radius:9px;padding:10px 12px;margin-bottom:14px;font-size:13px;font-weight:600}
.err.show{display:block}.ok{display:none;background:#173126;border:1px solid #2a5a42;color:var(--green);border-radius:9px;padding:10px 12px;margin-bottom:14px;font-size:13px}
.ok.show{display:block}.hidden{display:none !important}
#stepOtp{border-top:1px solid var(--line);padding-top:16px;margin-top:4px}
</style>
</head>
<body>
<div class="card">
  <div class="brand"><div class="mark">H</div>Homework Auto</div>
  <h1>Log in</h1>
  <p class="sub">Enter your password, then the 6-digit code we email you.</p>
  <div class="err" id="err"></div>
  <div class="ok" id="ok"></div>
  <form id="stepPass">
    <label for="email">Email</label>
    <input id="email" type="email" required autocomplete="username">
    <label for="password">Password</label>
    <input id="password" type="password" required autocomplete="current-password">
    <button class="btn" id="btnPass" type="submit">Continue</button>
  </form>
  <form id="stepOtp" class="hidden">
    <label for="otp">2FA code (from your email)</label>
    <input id="otp" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="6-digit code" autocomplete="one-time-code" required>
    <p class="sub" id="otpHint">We sent a code to your email. Enter it here.</p>
    <button class="btn" id="btnOtp" type="submit">Verify &amp; go to dashboard</button>
  </form>
  <div class="links">
    <a href="signup.html">Create account</a>
    <a href="reset.html">Reset password</a>
  </div>
  <div class="links" style="margin-top:8px"><a href="index.html">← Home</a><a href="change_password.html">Change password</a></div>
</div>
<script>
(() => {
  
  const err = document.getElementById('err');
  const ok = document.getElementById('ok');
  const stepPass = document.getElementById('stepPass');
  const stepOtp = document.getElementById('stepOtp');
  let pendingEmail = '';
  function showErr(m){ err.textContent = m || 'Something went wrong.'; err.classList.add('show'); ok.classList.remove('show'); }
  function showOk(m){ ok.textContent = m || ''; ok.classList.add('show'); err.classList.remove('show'); }
  function showOtpStep(message, debugCode){
    stepPass.classList.add('hidden');
    stepOtp.classList.remove('hidden');
    const hint = document.getElementById('otpHint');
    hint.textContent = debugCode
      ? ('Code emailed. If it did not arrive, use: ' + debugCode)
      : 'Check your inbox (and spam) for the 6-digit code.';
    showOk(message || 'Enter the verification code from your email.');
    document.getElementById('otp').focus();
  }
  stepPass.addEventListener('submit', async (e) => {
    e.preventDefault();
    err.classList.remove('show');
    const btn = document.getElementById('btnPass');
    btn.disabled = true;
    btn.textContent = 'Sending code…';
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    try {
      const r = await apiFetch('/api/auth/login', {
        method: 'POST',
        body: JSON.stringify({ email, password })
      });
      let x = {};
      try { x = await r.json(); } catch (_) { throw Error('Server returned an invalid response.'); }
      if (!r.ok) throw Error(x.error || 'Login failed');
      pendingEmail = email;
      showOtpStep(x.emailed ? 'Code sent to your email.' : (x.message || 'Enter your verification code.'), x.debug_code);
    } catch (ex) {
      showErr(ex.message || 'Could not log in.');
      btn.disabled = false;
      btn.textContent = 'Continue';
    }
  });
  stepOtp.addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('btnOtp');
    btn.disabled = true;
    btn.textContent = 'Verifying…';
    try {
      const r = await apiFetch('/api/auth/verify-login', {
        method: 'POST',
        body: JSON.stringify({
          email: pendingEmail,
          code: document.getElementById('otp').value.trim()
        })
      });
      let x = {};
      try { x = await r.json(); } catch (_) { throw Error('Server returned an invalid response.'); }
      if (!r.ok) throw Error(x.error || 'Verification failed');
      if (x.token) saveAuthToken(x.token);
      showOk('Verified — opening dashboard…');
      location.href = 'dashboard.html';
    } catch (ex) {
      showErr(ex.message || 'Invalid code.');
      btn.disabled = false;
      btn.textContent = 'Verify & go to dashboard';
    }
  });
})();

</script>
</body>
</html>
