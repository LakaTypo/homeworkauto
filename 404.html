<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page Not Found</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f8f8f8;
      color: #111;
    }

    .error {
      max-width: 520px;
      text-align: center;
    }

    .code {
      font-size: clamp(6rem, 20vw, 10rem);
      font-weight: 800;
      line-height: 0.9;
      letter-spacing: -0.08em;
    }

    h1 {
      margin-top: 24px;
      font-size: 1.75rem;
      letter-spacing: -0.03em;
    }

    p {
      margin: 12px 0 28px;
      color: #666;
      line-height: 1.6;
    }

    a {
      display: inline-block;
      padding: 12px 20px;
      border-radius: 10px;
      background: #111;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    a:hover {
      opacity: 0.85;
      transform: translateY(-1px);
    }
  </style>
</head>

<body>
  <main class="error">
    <div class="code">404</div>

    <h1>Page not found</h1>

    <p>
      Sorry, the page you're looking for doesn't exist or may have been moved on Flares servers.
    </p>

    <a href="/">Back to home</a>
  </main>
</body>
</html>
