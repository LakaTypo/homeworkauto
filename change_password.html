<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>StudyFlow · Change password</title>
<style>
:root{--bg:#0b0d0f;--panel:#141719;--line:#2a3033;--text:#f2f4f4;--muted:#8c969b;--accent:#f2a72c;--red:#f17878;--green:#52d39a}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font:14px/1.5 Inter,ui-sans-serif,system-ui,sans-serif;display:grid;place-items:center;padding:24px}
a{color:var(--accent)}.card{width:min(420px,100%);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px}
.brand{display:flex;align-items:center;gap:10px;font-weight:750;margin-bottom:18px}.mark{width:30px;height:30px;border-radius:9px;background:var(--accent);color:#151515;display:grid;place-items:center;font-weight:900}
h1{font-size:22px;margin:0 0 6px}.sub{color:var(--muted);font-size:13px;margin:0 0 20px}
label{display:block;color:#aab2b5;font-size:12px;margin-bottom:6px}
input{width:100%;background:#0e1112;border:1px solid #303739;color:var(--text);border-radius:8px;padding:11px 12px;margin-bottom:14px}
.btn{width:100%;border:0;border-radius:9px;padding:12px;font-weight:700;background:var(--accent);color:#17130b;cursor:pointer}
.err{display:none;background:#2b1718;border:1px solid #633032;color:var(--red);border-radius:9px;padding:10px 12px;margin-bottom:14px;font-size:13px;font-weight:600}
.err.show{display:block}.ok{display:none;background:#173126;border:1px solid #2a5a42;color:var(--green);border-radius:9px;padding:10px 12px;margin-bottom:14px;font-size:13px}
.ok.show{display:block}.hidden{display:none}
</style>
</head>
<body>
<div class="card">
  <div class="brand"><div class="mark">S</div>StudyFlow</div>
  <h1>Change password</h1>
  <p class="sub">Log in with your current password, verify with a code, then set a new one.</p>
  <div class="err" id="err"></div>
  <div class="ok" id="ok"></div>
  <form id="stepAuth">
    <label for="email">Email</label>
    <input id="email" type="email" required>
    <label for="password">Current password</label>
    <input id="password" type="password" required>
    <button class="btn" type="submit">Send verification code</button>
  </form>
  <form id="stepChange" class="hidden">
    <label for="otp">Verification code</label>
    <input id="otp" type="text" inputmode="numeric" maxlength="6" required>
    <label for="newpass">New password</label>
    <input id="newpass" type="password" minlength="8" required>
    <label for="newpass2">Confirm new password</label>
    <input id="newpass2" type="password" minlength="8" required>
    <button class="btn" type="submit">Save new password</button>
  </form>
  <p style="margin-top:14px;font-size:12px"><a href="login.html">Log in</a> · <a href="dashboard.html">Dashboard</a></p>
</div>
<script>
(() => {
  const err=document.getElementById('err'), ok=document.getElementById('ok');
  let pendingEmail='';
  function showErr(m){err.textContent=m;err.classList.add('show');ok.classList.remove('show')}
  function showOk(m){ok.textContent=m;ok.classList.add('show');err.classList.remove('show')}
  document.getElementById('stepAuth').addEventListener('submit', async e => {
    e.preventDefault();
    try {
      const email = document.getElementById('email').value.trim();
      const r = await fetch('/api/auth/change-request', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ email, password: document.getElementById('password').value })
      });
      const x = await r.json();
      if (!r.ok) throw Error(x.error || 'Could not start change');
      pendingEmail = email;
      document.getElementById('stepAuth').classList.add('hidden');
      document.getElementById('stepChange').classList.remove('hidden');
      showOk(x.emailed ? 'Check your email for the code, then set a new password.' : (x.debug_code ? ('Email failed — use code: '+x.debug_code) : 'Enter the code and your new password.'));
    } catch (ex) { showErr(ex.message); }
  });
  document.getElementById('stepChange').addEventListener('submit', async e => {
    e.preventDefault();
    const password = document.getElementById('newpass').value;
    if (password !== document.getElementById('newpass2').value) { showErr('Passwords do not match.'); return; }
    try {
      const r = await fetch('/api/auth/change-confirm', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ email: pendingEmail, code: document.getElementById('otp').value.trim(), password })
      });
      const x = await r.json();
      if (!r.ok) throw Error(x.error || 'Change failed');
      showOk('Password changed. Log in again.');
      setTimeout(() => location.href='login.html', 1200);
    } catch (ex) { showErr(ex.message); }
  });
})();
</script>
</body>
</html>
